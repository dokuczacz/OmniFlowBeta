name: Deploy OmniFlowCentral (Azure Functions Python)

on:
  push:
    branches: [ "main" ]
    paths:
      - "OmniFlowCentral/**"
      - ".github/workflows/deploy-omniflowcentral.yml"
  workflow_dispatch: {}

env:
  AZURE_FUNCTIONAPP_NAME: "OmniFlowCentral"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "OmniFlowCentral"
  PYTHON_VERSION: "3.11"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/requirements.txt"

      - name: Install dependencies into .python_packages
        run: |
          cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Functions (publish profile)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          sku: flexconsumption
          respect-funcignore: true
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
